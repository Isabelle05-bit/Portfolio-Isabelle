<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 1600 460" width="1600" height="460" role="img" aria-labelledby="t d" font-family="'Space Grotesk', 'Segoe UI', Arial, sans-serif">
  <title id="t">O caminho de um orçamento no app Katara</title>
  <desc id="d">Cinco etapas: metragem em metros quadrados, serviços e materiais sugeridos, resumo com total e lucro, PDF gerado e envio pelo WhatsApp.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3F5036"/>
    </marker>
  </defs>

  <rect y="70" width="1600" height="460" fill="#FFFFFF"/>

  <!-- Setas entre as etapas -->
  <g stroke="#3F5036" stroke-width="4" fill="none" marker-end="url(#seta)">
    <path d="M286 300 H 334"/>
    <path d="M590 300 H 638"/>
    <path d="M894 300 H 942"/>
    <path d="M1198 300 H 1246"/>
  </g>

  <!-- 1. Metragem -->
  <g transform="translate(40 110)">
    <rect width="240" height="380" rx="28" fill="#D4EC7A"/>
    <text x="28" y="52" font-size="20" font-weight="700" fill="#1E2619" font-family="'JetBrains Mono', Consolas, monospace">01</text>
    <rect x="28" y="88" width="184" height="150" rx="14" fill="#FFFFFF"/>
    <rect x="58" y="114" width="124" height="98" fill="none" stroke="#3F5036" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="120" y="174" font-size="34" font-weight="700" fill="#1E2619" text-anchor="middle">48 m²</text>
    <text x="28" y="292" font-size="30" font-weight="700" fill="#1E2619">Metragem</text>
    <text x="28" y="326" font-size="18" fill="#4D5547">Área de cada</text>
    <text x="28" y="350" font-size="18" fill="#4D5547">serviço</text>
  </g>

  <!-- 2. Serviços e materiais -->
  <g transform="translate(344 110)">
    <rect width="240" height="380" rx="28" fill="#CFC0F5"/>
    <text x="28" y="52" font-size="20" font-weight="700" fill="#1E2619" font-family="'JetBrains Mono', Consolas, monospace">02</text>
    <rect x="28" y="88" width="184" height="150" rx="14" fill="#FFFFFF"/>
    <g font-size="16" fill="#1E2619">
      <circle cx="50" cy="118" r="7" fill="#3F5036"/><text x="66" y="124">Tinta 18 L</text>
      <circle cx="50" cy="156" r="7" fill="#3F5036"/><text x="66" y="162">Massa corrida</text>
      <circle cx="50" cy="194" r="7" fill="#3F5036"/><text x="66" y="200">Lixa 150</text>
    </g>
    <text x="28" y="292" font-size="30" font-weight="700" fill="#1E2619">Materiais</text>
    <text x="28" y="326" font-size="18" fill="#4D5547">Sugeridos pela</text>
    <text x="28" y="350" font-size="18" fill="#4D5547">receita, editáveis</text>
  </g>

  <!-- 3. Resumo e lucro -->
  <g transform="translate(648 110)">
    <rect width="240" height="380" rx="28" fill="#F6C744"/>
    <text x="28" y="52" font-size="20" font-weight="700" fill="#1E2619" font-family="'JetBrains Mono', Consolas, monospace">03</text>
    <rect x="28" y="88" width="184" height="150" rx="14" fill="#FFFFFF"/>
    <g font-size="16" fill="#4D5547">
      <text x="46" y="124">Total</text>
      <text x="46" y="170">Lucro</text>
    </g>
    <g font-size="22" font-weight="700" fill="#1E2619" text-anchor="end">
      <text x="196" y="126">R$ 3.840</text>
      <text x="196" y="172" fill="#3F5036">R$ 1.920</text>
    </g>
    <rect x="46" y="196" width="150" height="10" rx="5" fill="#E3E0D8"/>
    <rect x="46" y="196" width="75" height="10" rx="5" fill="#3F5036"/>
    <text x="28" y="292" font-size="30" font-weight="700" fill="#1E2619">Resumo</text>
    <text x="28" y="326" font-size="18" fill="#4D5547">Total e lucro</text>
    <text x="28" y="350" font-size="18" fill="#4D5547">em tempo real</text>
  </g>

  <!-- 4. PDF -->
  <g transform="translate(952 110)">
    <rect width="240" height="380" rx="28" fill="#D9C5A1"/>
    <text x="28" y="52" font-size="20" font-weight="700" fill="#1E2619" font-family="'JetBrains Mono', Consolas, monospace">04</text>
    <rect x="68" y="80" width="104" height="166" rx="8" fill="#FFFFFF" stroke="#1E2619" stroke-width="2"/>
    <rect x="68" y="80" width="104" height="30" rx="8" fill="#3F5036"/>
    <rect x="68" y="98" width="104" height="12" fill="#3F5036"/>
    <text x="120" y="101" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">PDF</text>
    <g fill="#E3E0D8">
      <rect x="82" y="126" width="76" height="8" rx="4"/>
      <rect x="82" y="144" width="60" height="8" rx="4"/>
      <rect x="82" y="162" width="76" height="8" rx="4"/>
      <rect x="82" y="180" width="48" height="8" rx="4"/>
    </g>
    <rect x="82" y="212" width="76" height="16" rx="4" fill="#F6C744"/>
    <text x="28" y="292" font-size="30" font-weight="700" fill="#1E2619">PDF</text>
    <text x="28" y="326" font-size="18" fill="#4D5547">Do cliente, sem</text>
    <text x="28" y="350" font-size="18" fill="#4D5547">custos, e interno</text>
  </g>

  <!-- 5. WhatsApp -->
  <g transform="translate(1256 110)">
    <rect width="304" height="380" rx="28" fill="#3F5036"/>
    <text x="28" y="52" font-size="20" font-weight="700" fill="#E8EBDF" font-family="'JetBrains Mono', Consolas, monospace">05</text>
    <rect x="28" y="88" width="248" height="150" rx="14" fill="#F7F6F3"/>
    <rect x="48" y="108" width="176" height="40" rx="12" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="2"/>
    <text x="64" y="134" font-size="16" fill="#1E2619">Segue o orçamento</text>
    <rect x="104" y="162" width="152" height="56" rx="12" fill="#D4EC7A"/>
    <rect x="118" y="174" width="26" height="32" rx="4" fill="#FFFFFF" stroke="#3F5036" stroke-width="2"/>
    <text x="131" y="195" font-size="10" font-weight="700" fill="#3F5036" text-anchor="middle">PDF</text>
    <text x="154" y="196" font-size="15" fill="#1E2619">orcamento.pdf</text>
    <text x="28" y="292" font-size="30" font-weight="700" fill="#FFFFFF">WhatsApp</text>
    <text x="28" y="326" font-size="18" fill="#E8EBDF">Pelo menu de compartilhar</text>
    <text x="28" y="350" font-size="18" fill="#E8EBDF">do Android</text>
  </g>
</svg>
